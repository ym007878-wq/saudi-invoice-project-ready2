name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Gradle Wrapper & Grant Permissions
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Error: gradlew wrapper not found in root directory!"
            exit 1
          fi
          chmod +x gradlew
          ls -la gradlew

      - name: Clean Build Cache & Old Artifacts
        run: |
          echo "Cleaning previous build..."
          ./gradlew clean --stacktrace

      - name: Assemble Debug APK from Source
        run: |
          echo "Building debug APK..."
          ./gradlew --no-daemon --no-build-cache assembleDebug --stacktrace --info

      - name: Verify Generated APK Existence
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Build failed! Expected APK not found at $APK_PATH"
            exit 1
          fi
          echo "APK successfully generated at $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Generate Detailed Build & Security Report
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          SHA256_HASH=$(sha256sum "$APK_PATH" | awk '{print $1}')
          MD5_HASH=$(md5sum "$APK_PATH" | awk '{print $1}')
          FILE_SIZE=$(du -h "$APK_PATH" | awk '{print $1}')
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat <<EOF > build-report.txt
          =======================================================
          تقرير بناء تطبيق قارئ الفاتورة الإلكترونية السعودية
          SAUDI INVOICE SCANNER - ANDROID BUILD REPORT
          =======================================================
          رقم تشغيل GitHub (Run ID) : ${{ github.run_id }}
          محاولة التشغيل (Run Number): ${{ github.run_number }}
          الفرع (Branch)            : ${{ github.ref_name }}
          معرّف الـ Commit (SHA)    : ${{ github.sha }}
          المرسل (Triggered By)     : ${{ github.actor }}
          تاريخ وتوقيت البناء (UTC) : $BUILD_DATE
          
          -------------------------------------------------------
          معلومات الحزمة والملف التنفيذي (Package & APK Info)
          -------------------------------------------------------
          اسم الحزمة (Application ID) : com.aistudio.saudiinvoicescanner.kavx
          رقم الإصدار (Version Code)  : 1
          اسم الإصدار (Version Name)  : 1.0.0
          مسار الملف الفعلي           : app/build/outputs/apk/debug/app-debug.apk
          حجم الملف                   : $FILE_SIZE
          
          -------------------------------------------------------
          البصمات الرقمية للتحقق من سلامة الملف (Digital Fingerprints)
          -------------------------------------------------------
          SHA-256 Checksum : $SHA256_HASH
          MD5 Checksum    : $MD5_HASH
          =======================================================
          EOF
          
          cat build-report.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaudiInvoiceScanner-APK-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build & Integrity Report
        uses: actions/upload-artifact@v4
        with:
          name: Build-Report-${{ github.run_id }}
          path: build-report.txt
          if-no-files-found: error
          retention-days: 30
