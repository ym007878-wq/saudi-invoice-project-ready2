
name: Build and Package Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and Package Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Latest Source
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Project Structure
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle Wrapper file is missing."
            exit 1
          fi

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: Gradle settings file is missing."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
            echo "ERROR: Android app Gradle file is missing."
            exit 1
          fi

          chmod +x gradlew

          echo "Project structure verified."

      - name: Verify Gradle Wrapper
        run: ./gradlew --no-daemon --version

      - name: Clean Previous Build
        run: ./gradlew --no-daemon clean

      - name: Build Fresh Debug APK
        run: ./gradlew --no-daemon --no-build-cache assembleDebug

      - name: Verify APK and Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p build-report

          sha256sum "$APK" \
            | tee build-report/apk-sha256.txt

          cp "$APK" build-report/SaudiInvoiceScanner.apk

          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Upload Fresh APK
        uses: actions/upload-artifact@v4
        with:
          name: SaudiInvoiceScanner-APK-${{ github.run_number }}
          path: build-report/SaudiInvoiceScanner.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA256 Report
        uses: actions/upload-artifact@v4
        with:
          name: SaudiInvoiceScanner-Report-${{ github.run_number }}
          path: build-report/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
