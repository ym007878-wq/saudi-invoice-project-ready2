
name: Build and Package Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Source
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Project Files
        run: |
          echo "Checking Android project..."
          test -f settings.gradle.kts || test -f settings.gradle
          test -f gradlew
          test -f app/build.gradle.kts || test -f app/build.gradle
          chmod +x gradlew

      - name: Verify Gradle Wrapper
        run: |
          ./gradlew --version

      - name: Clean Previous Build
        run: |
          ./gradlew --no-daemon clean

      - name: Build New Debug APK
        run: |
          ./gradlew --no-daemon --no-build-cache assembleDebug

      - name: Verify APK
        id: apk
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"

      - name: Upload Fresh APK
        uses: actions/upload-artifact@v4
        with:
          name: SaudiInvoiceScanner-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA256 Report
        uses: actions/upload-artifact@v4
        with:
          name: SaudiInvoiceScanner-SHA256-${{ github.run_number }}
          path: apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
